name: Sync validated Codex calendar data
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-codex.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: codex-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validation unit tests
        run: python -m unittest discover -s tests -v
      - name: Read only JSON from the untrusted Codex branch
        run: |
          git fetch --no-tags origin '+refs/heads/codex/calendar-updates:refs/remotes/origin/codex/calendar-updates'
          git show origin/codex/calendar-updates:data/codex_proposals.json > /tmp/codex_proposals.json
          test "$(wc -c < /tmp/codex_proposals.json)" -le 256000
      - name: Validate changes and test calendar build
        id: validate
        run: |
          python scripts/apply_codex_proposals.py --proposal /tmp/codex_proposals.json --output data/codex_synced_events.json
          python scripts/build.py
          if git diff --quiet -- data/codex_synced_events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No event data changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp data/codex_synced_events.json /tmp/codex_synced_events.json
          fi
      - name: Open or refresh a data-only PR (never push directly to main)
        if: steps.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/refresh_calendar_pr.sh /tmp/codex_synced_events.json
      - name: Merge validated data
        if: steps.validate.outputs.changed == 'true' && vars.ENABLE_CALENDAR_AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RULES="$(gh api "repos/${{ github.repository }}/rulesets" --jq '.[] | select(.enforcement == "active") | .id')"
          ALLOWED=false
          for id in $RULES; do
            if gh api "repos/${{ github.repository }}/rulesets/$id" --jq 'select((.conditions.ref_name.include // []) | index("refs/heads/main")) | select(any(.rules[]; .type == "pull_request")) | .id' | grep -q '[0-9]'; then
              ALLOWED=true
            fi
          done
          if [ "$ALLOWED" != true ]; then
            echo "Auto-merge disabled: no active main PR ruleset"
            exit 1
          fi
          PR="$(gh pr list --head automation/codex-sync --base main --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository == false))[0].number // empty')"
          test -n "$PR"
          HEAD_SHA="$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')"
          # A fork can use the same branch name: verify repository identity too.
          test "$(gh pr view "$PR" --json isCrossRepository --jq '.isCrossRepository')" = "false"
          test "$(gh pr view "$PR" --json headRepository,headRepositoryOwner --jq '.headRepositoryOwner.login + "/" + .headRepository.name')" = "$GITHUB_REPOSITORY"
          test "$(gh pr view "$PR" --json headRefName,baseRefName --jq '.headRefName + ":" + .baseRefName')" = "automation/codex-sync:main"
          test "$(gh pr diff "$PR" --name-only)" = "data/codex_synced_events.json"
          git fetch origin "$HEAD_SHA"
          git show "$HEAD_SHA:data/codex_synced_events.json" > /tmp/pr-validated-events.json
          cmp /tmp/codex_synced_events.json /tmp/pr-validated-events.json
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
      - name: Recover any missing publication of main
        if: ${{ !cancelled() && vars.ENABLE_CALENDAR_AUTO_MERGE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reconcile_calendar_pages.sh
