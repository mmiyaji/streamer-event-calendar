name: Validate Codex calendar proposals
on:
  pull_request:
    branches: [main]
    paths:
      - data/codex_proposals.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/calendar-updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve proposal data only (never execute Codex branch code)
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_HEAD"
          git show "$PR_HEAD:data/codex_proposals.json" > /tmp/codex_proposals.json
      - name: Check proposal schema and source URLs
        if: github.event_name == 'pull_request'
        run: python scripts/validate_codex_proposals.py /tmp/codex_proposals.json
